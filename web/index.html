<!DOCTYPE html>
<html>
<head>
  <script>
    // Google OAuth treats localhost and 127.0.0.1 as different origins.
    // Keep local web authentication on the origin registered in Google Cloud.
    const localAliases = new Set(['127.0.0.1', '0.0.0.0', '::1', '[::1]']);
    if (localAliases.has(window.location.hostname)) {
      const authorizedUrl = new URL(window.location.href);
      authorizedUrl.hostname = 'localhost';
      window.location.replace(authorizedUrl.toString());
    }
  </script>

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- Public OAuth application identifier used by Google Identity Services. -->
  <meta name="google-signin-client_id" content="729107585198-2djt2sm2nho5k52cvc0itom0m1nmrkpa.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="URL Defender">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>URL Defender - Protect Yourself Online</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #flutter-host {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    #flutter-host > flutter-view {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

</head>
<body>
  <div id="flutter-host"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Flutter's generated service worker can keep an older main.dart.js while
    // developing locally. Clear local registrations/caches before loading the
    // current bundle. Production deployments keep normal PWA caching.
    (async function loadFlutter() {
      const localHosts = new Set(['localhost', '127.0.0.1', '::1']);

      if (localHosts.has(window.location.hostname)) {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        }
      }

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=google-web-single-view-20260716-2';
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
